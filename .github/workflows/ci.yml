name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # Install a pinned prebuilt stellar-cli. `cargo install stellar-cli` is not
      # used because the `opt` feature it needs no longer exists on the crate
      # (renamed in v28), which would break the build job for every PR.
      # Install the stellar-cli 28.0.0 prebuilt binary instead of compiling
      # from source: a from-source `cargo install` takes ~10 minutes and OOMs
      # on the 2-core/7 GB GitHub runner. The release asset is checksum-pinned.
      # 28.x builds protocol-21 contracts out of the box.
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli
      - name: Build contracts
        run: stellar contract build

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
