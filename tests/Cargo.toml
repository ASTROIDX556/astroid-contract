[package]
name = "astroid-integration-tests"
description = "End-to-end integration tests for the Astroid contract workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
astroid-shared = { workspace = true }
astroid-interfaces = { workspace = true }

# Integration tests deploy every workspace contract into a shared Env, so all
# eight contracts are compiled in as dev-dependencies.
astroid-budget = { path = "../contracts/budget" }
astroid-escrow = { path = "../contracts/escrow" }
astroid-multisig = { path = "../contracts/multisig" }
astroid-policy = { path = "../contracts/policy" }
astroid-proposal = { path = "../contracts/proposal" }
astroid-registry = { path = "../contracts/registry" }
astroid-treasury = { path = "../contracts/treasury" }
astroid-wallet = { path = "../contracts/wallet" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
